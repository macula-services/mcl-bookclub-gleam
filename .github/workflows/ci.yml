name: ci

# The tests gate the image. A push to main or a v* tag builds and pushes the
# image only after the test job passed. Pull requests run the tests only.
#
#   push to main : ghcr.io/macula-services/mcl-bookclub-gleam:main and :<sha>
#   push of v*   : ghcr.io/macula-services/mcl-bookclub-gleam:<X.Y.Z>, signed by attest
#
# NOTHING MOVES :latest. The dev fleet runs no tag: macula-fleet's pin-releases workflow finds
# a signed v* release, verifies it was signed on that tag and pins its digest (macula-fleet#14,
# #15), so a green v* tag is the deploy. A push to main deploys nothing.
#
# This org does not commit lock files (manifest.toml is git-ignored): the
# `~>` floors in gleam.toml ARE the pin, and a rebuild picks up the newest
# hex -- which is why there is no tested-resolve artifact step, unlike the
# Phoenix workflow's mix.lock handover.
#
# PATH FILTERS. A docs-only change must not rebuild or re-push an image. Keep
# this list to things that cannot change what the image contains.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels an older run, image build included, so an older
# commit's image never lands after a newer one's.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # REFUSED BEFORE ANYTHING IS PUSHED: a v* tag off the default branch (or off its
  # line's release-<major>.<minor> branch), or whose version is not the one this
  # repository publishes, stops here, so a refused tag leaves no image on the
  # registry. Any other ref passes. attest-image checks the same again before it
  # signs. Pinned by full commit sha, as the attest call is.
  guard:
    permissions:
      contents: read
    uses: macula-io/macula-ci-images/.github/workflows/release-guard.yml@b4c41abb404c32215a2823b7f19ac65b732e1dfe

  test:
    name: gates (OTP 28.4.3 / Gleam 1.18.1)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # THE TOOLCHAIN IS THE IMAGE, and the same image by digest is the
    # Containerfile's builder, so the gates run on exactly the toolchain the
    # release ships with.
    container:
      image: ghcr.io/macula-io/macula-ci-gleam:gleam118-20260925-1402@sha256:4a177d3012dea97fb310a6f037197b4cc4ef1e38dc96f1bf246b57585e913b67

    env:
      MACULA_FORCE_SOURCE_BUILD: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Verify the toolchain
        run: |
          erl -noshell -eval 'io:format("OTP ~s~n",[erlang:system_info(otp_release)]),halt().'
          gleam --version
          erl -noshell -eval '
            case lists:member(mldsa87, crypto:supports(public_keys)) of
                true  -> io:format("mldsa87 supported~n"), halt(0);
                false -> io:format("mldsa87 MISSING~n"), halt(1)
            end.'

      - name: Format check
        run: gleam format --check .

      - name: Lint (elvis mcl_min on the generated Erlang)
        run: scripts/lint.sh

      - name: Tests
        run: scripts/test.sh

  image:
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    name: image (amd64)
    needs: [guard, test]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/macula-services/mcl-bookclub-gleam

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=long,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          flavor: |
            latest=false

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            CACHE_BUST=${{ github.sha }}
            GIT_SHA=${{ github.sha }}

  # SIGNED BY DIGEST, SBOM AND PROVENANCE ATTESTED, keyless, so a box can refuse any digest that did
  # not come from this workflow on a commit of this repository (macula-fleet's reconciler checks it
  # before it runs the image). Pinned by full commit sha: the signing identity is that file at that
  # ref. See macula-ci-images' README.
  attest:
    needs: image
    if: needs.image.outputs.digest != ''
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: macula-io/macula-ci-images/.github/workflows/attest-image.yml@fa59fba58d1b65dce35f8613dcb257273a0f29ed
    with:
      image: ghcr.io/macula-services/mcl-bookclub-gleam
      digest: ${{ needs.image.outputs.digest }}
