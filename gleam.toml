name = "mcl_bookclub_gleam"
version = "0.1.0"
description = "The Bookclub-on-Mesh in Gleam: the third club on the mesh, drop-in twin of mcl-bookclub and mcl-bookclub-phoenix -- same org, topics and procedure names, distinguishable only by node identity."
licences = ["Apache-2.0"]
repository = { type = "github", user = "macula-services", repo = "mcl-bookclub-gleam" }

# The division boundary lives in the folder layout (facade / host_bookclub /
# project_bookclub / query_bookclub under src/mcl_bookclub_gleam) and is
# enforced by tests, exactly as the Erlang twin does it -- see README.md.
#
# DEP FLOORS ARE THE PIN. This org does not commit lock files (manifest.toml is
# git-ignored): the `~>` floors below ARE the pin, and a rebuild picks up the
# newest compatible hex. The 0.31 floor on mcl_om is deliberate and
# load-bearing: it registers each capability on its serving station only
# (0.29 made the station choice, mcl-om#5, corpus Demon 69) and requires
# macula 12.7.0, whose pool renews an advertised chain before its 30-minute
# delegation lapses (macula#38, D32).

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
# The shared L2 substrate: mesh SDK, realm identity, capabilities, health. It
# opens no store from 0.35 on (mcl-om#10): this service declares and opens its
# own (internal/store). 0.37 brings macula 13.5 and the inbound guard pipeline
# (mcl-om#14); floats within 0.x on released versions (dev rule).
mcl_om = ">= 0.37.0 and < 1.0.0"
# This service's own event store.
reckon_db = "~> 5.4"
# The CQRS/ES framework. 1.24: a restart's replayed events are marked
# (`replaying => true') and a handler declares its replay_policy; 1.26.1
# measures telemetry durations on the monotonic clock.
evoq = ">= 1.26.1 and < 2.0.0"
# The reckon-db adapter, chosen in config/sys.config.src.
# 2.7.2 at least: 2.7.0 read snapshots back empty, so an aggregate reloaded
# past a snapshot rebuilt from nothing.
reckon_evoq = ">= 2.7.2 and < 3.0.0"
# The read model: a single sqlite file the PRJ division writes and the QRY
# division reads.
esqlite = "~> 0.9"
# The LAN admin UI: cowboy serves the static page and the JSON API, jsx is
# the codec. (Both ride the dependency tree via mcl_om already; named here
# because this service uses them directly -- same as the Erlang twin.)
cowboy = "2.12.0"
jsx = "3.1.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
# The lint gate's engine (scripts/lint.sh runs it directly). Declared here so
# it is fetched and built like any dependency, never carried as committed
# beams.
elvis_core = "~> 6.0"
